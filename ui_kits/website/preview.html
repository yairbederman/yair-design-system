<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Preview Harness · y[AI]r studio</title>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-0); color: var(--fg-1); font-family: var(--font-body-en); min-height: 100vh; }
  .harness {
    display: grid;
    grid-template-columns: 240px 1fr;
    height: 100vh;
  }
  aside {
    border-inline-end: 1px solid var(--rule);
    padding: 24px 20px;
    background: var(--bg-1);
    overflow-y: auto;
  }
  aside h1 {
    font-family: var(--font-mono-en);
    font-size: 13px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg-3);
    margin: 0 0 16px;
  }
  fieldset {
    border: 0;
    padding: 0;
    margin: 0 0 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  legend {
    font-family: var(--font-mono-en);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 8px;
    padding: 0;
  }
  .opt {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--rule);
    border-radius: var(--r-md);
    background: var(--bg-2);
    color: var(--fg-2);
    font-family: var(--font-mono-en);
    font-size: 12px;
    cursor: pointer;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
    min-height: 36px;
  }
  .opt:hover { background: var(--bg-3); color: var(--fg-1); }
  .opt input { accent-color: var(--accent); }
  .opt.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--fg-1);
  }
  .opt .meta {
    margin-inline-start: auto;
    color: var(--fg-3);
    font-size: 11px;
  }
  .stage {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 20% 0%, rgba(217, 104, 50, 0.06), transparent 40%),
      var(--bg-0);
    overflow: auto;
  }
  .frame-wrap {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
  .frame-meta {
    font-family: var(--font-mono-en);
    font-size: 12px;
    color: var(--fg-3);
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .frame-meta .live { color: var(--accent); }
  .frame {
    flex: 0 0 auto;
    align-self: center;
    background: var(--bg-1);
    border: 1px solid var(--rule);
    border-radius: var(--r-md);
    overflow: hidden;
    transition: width var(--dur) var(--ease), height var(--dur) var(--ease);
    box-shadow: var(--edge-top);
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--bg-0);
    display: block;
  }
  .note {
    font-size: 11px;
    color: var(--fg-3);
    line-height: 1.5;
    margin-top: 8px;
    font-family: var(--font-body-en);
  }
  .note code {
    font-family: var(--font-mono-en);
    color: var(--fg-2);
    background: var(--bg-2);
    padding: 1px 4px;
    border-radius: 2px;
  }
  .open-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border: 1px solid var(--rule);
    border-radius: var(--r-md);
    color: var(--fg-2);
    text-decoration: none;
    font-family: var(--font-mono-en);
    font-size: 11px;
  }
  .open-link:hover { color: var(--fg-1); border-color: var(--fg-3); }
</style>
</head>
<body>
<div class="harness">
  <aside>
    <h1>preview harness</h1>

    <fieldset>
      <legend>language</legend>
      <label class="opt"><input type="radio" name="lang" value="en" checked> english <span class="meta">ltr</span></label>
      <label class="opt"><input type="radio" name="lang" value="he"> עברית <span class="meta">rtl</span></label>
    </fieldset>

    <fieldset>
      <legend>viewport</legend>
      <label class="opt"><input type="radio" name="vp" value="375x720"> mobile <span class="meta">375</span></label>
      <label class="opt"><input type="radio" name="vp" value="768x900"> tablet <span class="meta">768</span></label>
      <label class="opt"><input type="radio" name="vp" value="1280x800" checked> desktop <span class="meta">1280</span></label>
      <label class="opt"><input type="radio" name="vp" value="full"> fluid <span class="meta">100%</span></label>
    </fieldset>

    <fieldset>
      <legend>checks</legend>
      <label class="opt"><input type="checkbox" id="motion"> reduced motion</label>
      <label class="opt"><input type="checkbox" id="contrast"> show focus rings</label>
    </fieldset>

    <p class="note">
      Use <code>Tab</code> inside the frame to walk the keyboard order.
      The first tab stop is the <em>skip to content</em> link.
    </p>

    <a class="open-link" id="open" href="index.html" target="_blank">open standalone ↗</a>
  </aside>

  <section class="stage">
    <div class="frame-wrap">
      <div class="frame-meta">
        <span id="vp-label">1280 × 800</span>
        <span>·</span>
        <span class="live" id="lang-label">english · ltr</span>
        <span>·</span>
        <span id="motion-label">motion: full</span>
      </div>
      <div class="frame" id="frame">
        <iframe id="site" src="index.html" title="Website preview"></iframe>
      </div>
    </div>
  </section>
</div>

<script>
  const frame = document.getElementById('frame');
  const iframe = document.getElementById('site');
  const vpLabel = document.getElementById('vp-label');
  const langLabel = document.getElementById('lang-label');
  const motionLabel = document.getElementById('motion-label');
  const openLink = document.getElementById('open');

  let lang = 'en';
  let vp = '1280x800';
  let reducedMotion = false;
  let showFocus = false;

  function applyVp() {
    if (vp === 'full') {
      frame.style.width = 'min(100%, 1400px)';
      frame.style.height = '900px';
      vpLabel.textContent = 'fluid';
    } else {
      const [w, h] = vp.split('x').map(Number);
      frame.style.width = w + 'px';
      frame.style.height = h + 'px';
      vpLabel.textContent = w + ' × ' + h;
    }
  }

  function applyLang() {
    const file = lang === 'he' ? 'index.he.html' : 'index.html';
    if (!iframe.src.endsWith(file)) iframe.src = file;
    openLink.href = file;
    langLabel.textContent = lang === 'he' ? 'עברית · rtl' : 'english · ltr';
    langLabel.dir = lang === 'he' ? 'rtl' : 'ltr';
  }

  function applyMotion() {
    motionLabel.textContent = 'motion: ' + (reducedMotion ? 'reduced' : 'full');
    // Inject a stylesheet into the iframe that simulates prefers-reduced-motion.
    try {
      const doc = iframe.contentDocument;
      if (!doc) return;
      let s = doc.getElementById('__rm_simulate');
      if (reducedMotion) {
        if (!s) {
          s = doc.createElement('style');
          s.id = '__rm_simulate';
          s.textContent = '*,*::before,*::after{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;}';
          doc.head.appendChild(s);
        }
      } else if (s) {
        s.remove();
      }
    } catch (e) {}
  }

  function applyFocus() {
    try {
      const doc = iframe.contentDocument;
      if (!doc) return;
      let s = doc.getElementById('__focus_show');
      if (showFocus) {
        if (!s) {
          s = doc.createElement('style');
          s.id = '__focus_show';
          s.textContent = 'a,button,input,select,textarea,[tabindex]{outline:1px dashed rgba(217,104,50,0.45) !important;outline-offset:2px !important;}';
          doc.head.appendChild(s);
        }
      } else if (s) {
        s.remove();
      }
    } catch (e) {}
  }

  function setActive(name) {
    document.querySelectorAll('input[name="' + name + '"]').forEach(r => {
      r.closest('.opt').classList.toggle('active', r.checked);
    });
  }

  document.querySelectorAll('input[name="lang"]').forEach(r => {
    r.addEventListener('change', () => { lang = r.value; setActive('lang'); applyLang(); });
  });
  document.querySelectorAll('input[name="vp"]').forEach(r => {
    r.addEventListener('change', () => { vp = r.value; setActive('vp'); applyVp(); });
  });
  document.getElementById('motion').addEventListener('change', e => {
    reducedMotion = e.target.checked;
    e.target.closest('.opt').classList.toggle('active', reducedMotion);
    applyMotion();
  });
  document.getElementById('contrast').addEventListener('change', e => {
    showFocus = e.target.checked;
    e.target.closest('.opt').classList.toggle('active', showFocus);
    applyFocus();
  });
  iframe.addEventListener('load', () => { applyMotion(); applyFocus(); });

  setActive('lang'); setActive('vp'); applyVp();
</script>
</body>
</html>
