<!--
  Inline written-brand treatment only — NOT the primary visual logo.

  This snippet is the typographic spelling of the brand for inline use
  (body copy, accessible labels, header text, etc.). It is not the
  carousel's footer/CTA logo.

  For carousel footers and CTA logos, use the SVG logo assets:
    assets/wordmark.svg          — primary visual logo (block lockup, with STUDIO)
    assets/wordmark-compact.svg  — block lockup, no STUDIO caption
    assets/wordmark-accent.svg   — accent block variant (orange block) — emphasis only

  Always LTR. The `aria-label` includes "studio" per brand rule.
-->
<span class="wordmark" aria-label="y[AI]r studio" dir="ltr">
  <span class="wordmark-y">y</span><span class="wordmark-bracket">[</span><span class="wordmark-ai">AI</span><span class="wordmark-bracket">]</span><span class="wordmark-r">r</span>
  <span class="wordmark-studio" style="font-size: 0.34em; padding-left: 0.6em;">studio</span>
</span>
