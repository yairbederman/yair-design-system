<!--
  inline-written-brand.html
  ----------------------------------------------------------
  Carousel-visual brand slot.

  This partial renders the **primary visual logo** (block SVG)
  for carousel placements that need a real logo \u2014 footer,
  CTA lockup, cover anchor.

  Chosen variant: assets/wordmark.svg
    \u2022 white block on dark, reads cleanly on #121211
    \u2022 includes the STUDIO caption (full lockup)
    \u2022 has a viewBox, no embedded raster, no external deps
    \u2022 monospace text uses a fallback chain (ui-monospace \u2192
      SFMono-Regular \u2192 JetBrains Mono \u2192 Menlo \u2192 Consolas \u2192
      monospace) so PDF / PNG export does not require a
      specific local font.

  For tightly-bound footer slots, swap to wordmark-compact.svg.
  For accent-emphasis blocks (rare), swap to wordmark-accent.svg.
  Do NOT replace this with bracket text \u2014 the typographic
  spelling below is the inline-written-brand fallback only,
  not the primary visual logo.
-->
<img class="brand-logo" src="../../../assets/wordmark.svg" alt="y[AI]r studio" />

<!--
  Inline written-brand fallback only \u2014 not the primary visual logo.
  Kept here for reference where a live, selectable, screen-reader-
  friendly typographic spelling is required (body copy, accessible
  labels, header text). Do NOT use this as the carousel footer/CTA
  logo \u2014 use the SVG <img> above.

  <span class="wordmark" aria-label="y[AI]r studio" dir="ltr">
    <span class="wordmark-y">y</span><span class="wordmark-bracket">[</span><span class="wordmark-ai">AI</span><span class="wordmark-bracket">]</span><span class="wordmark-r">r</span>
    <span class="wordmark-studio" style="font-size: 0.34em; padding-left: 0.6em;">studio</span>
  </span>
-->
