<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>EN · 02 content — y[AI]r studio carousel</title>
  <link rel="stylesheet" href="../../../colors_and_type.css">
  <link rel="stylesheet" href="../../linkedin-carousel/shared/carousel.css">
</head>
<body>
  <div class="carousel-stage">
    <article class="slide is-content" data-screen-label="EN · 02 Content">
      <div class="slide-frame">

        <header class="slide-header">
          <span class="slide-eyebrow">field notes <span class="dot">·</span> AI in production</span>
          <span class="slide-stamp"><span class="num">02</span> / 11</span>
        </header>

        <main class="slide-main">

          <span class="meta-label"><span style="display:inline-block;width:6px;height:6px;background:currentColor"></span> the gap</span>

          <h2 class="content-lede">
            the demo works because the path is controlled.
          </h2>

          <p class="slide-body">
            production fails because the workflow has <strong>exceptions</strong>,
            <strong>handoffs</strong>, <strong>messy inputs</strong>, and <strong>real users</strong>.
          </p>

          <div class="content-aside" aria-hidden="true">
            <span class="pip"></span> demo &nbsp;<span style="color:var(--rule-strong)">→</span>&nbsp; production
          </div>

        </main>

        <footer class="slide-footer">
          <span class="wordmark-slot">
            <img class="footer-logo" src="../../../assets/wordmark-compact.svg" alt="y[AI]r studio" style="height:24px;width:auto;display:block" />
          </span>
          <span class="page-num"><span class="now">02</span><span class="sep">/</span>11</span>
        </footer>

      </div>
    </article>
  </div>

  <script>
    function fit() {
      const slide = document.querySelector('.slide');
      const stage = document.querySelector('.carousel-stage');
      if (!slide || !stage) return;
      const pad = 48;
      const sw = (stage.clientWidth  - pad) / 1080;
      const sh = (stage.clientHeight - pad) / 1350;
      slide.style.setProperty('--carousel-scale', Math.min(sw, sh, 1));
    }
    addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
