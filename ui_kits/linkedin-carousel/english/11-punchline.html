<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>EN · 11 punchline — y[AI]r studio carousel</title>
  <link rel="stylesheet" href="../../../colors_and_type.css">
  <link rel="stylesheet" href="../../linkedin-carousel/shared/carousel.css">
</head>
<body>
  <div class="carousel-stage">
    <article class="slide is-punchline" data-screen-label="EN · 11 Punchline">
      <div class="slide-frame">

        <header class="slide-header">
          <span class="slide-eyebrow">field notes <span class="dot">·</span> AI in production</span>
          <span class="slide-stamp"><span class="num">11</span> / 11</span>
        </header>

        <main class="slide-main">
          <p class="punchline-quote">
            <span class="mark">"</span>AI isn't coming.<br>
            it's <span class="hl">here</span> — and<br>
            most teams are still<br>
            running demos.<span class="mark">"</span>
          </p>
          <cite class="punchline-cite">yair · founder · y[AI]r studio</cite>
        </main>

        <footer class="slide-footer">
          <span class="wordmark-slot">
            <img class="footer-logo" src="../../../assets/wordmark-compact.svg" alt="y[AI]r studio" style="height:24px;width:auto;display:block" />
          </span>
          <span class="page-num"><span class="now">11</span><span class="sep">/</span>11</span>
        </footer>

      </div>
    </article>
  </div>

  <script>
    function fit() {
      const slide = document.querySelector('.slide');
      const stage = document.querySelector('.carousel-stage');
      if (!slide || !stage) return;
      const pad = 48;
      const sw = (stage.clientWidth  - pad) / 1080;
      const sh = (stage.clientHeight - pad) / 1350;
      slide.style.setProperty('--carousel-scale', Math.min(sw, sh, 1));
    }
    addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
