<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>EN · 01 cover — y[AI]r studio carousel</title>
  <link rel="stylesheet" href="../../../colors_and_type.css">
  <link rel="stylesheet" href="../../linkedin-carousel/shared/carousel.css">
  <style>
    /* Per-slide overrides only. Shared role classes live in carousel.css. */
    .cover-display em {
      color: var(--accent);
      font-style: normal;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="carousel-stage">
    <article class="slide is-cover" data-screen-label="EN · 01 Cover">
      <div class="slide-frame">

        <header class="slide-header">
          <span class="slide-eyebrow">field notes <span class="dot">·</span> AI in production</span>
          <span class="slide-stamp"><span class="num">01</span> / 11</span>
        </header>

        <main class="slide-main">
          <span class="cover-kicker"><span class="bar"></span> swipe →</span>

          <h1 class="slide-display cover-display">
            why most AI&nbsp;workflows <em>fail</em> after the demo.
          </h1>
        </main>

        <footer class="slide-footer">
          <span class="wordmark-slot">
            <img class="footer-logo" src="../../../assets/wordmark-compact.svg" alt="y[AI]r studio" style="height:24px;width:auto;display:block" />
          </span>
          <span class="page-num"><span class="now">01</span><span class="sep">/</span>11</span>
        </footer>

      </div>
    </article>
  </div>

  <script>
    // Auto-fit the fixed 1080x1350 slide to the viewport.
    function fit() {
      const slide = document.querySelector('.slide');
      const stage = document.querySelector('.carousel-stage');
      if (!slide || !stage) return;
      const pad = 48;
      const sw = (stage.clientWidth  - pad) / 1080;
      const sh = (stage.clientHeight - pad) / 1350;
      slide.style.setProperty('--carousel-scale', Math.min(sw, sh, 1));
    }
    addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
