<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>HE · 09 case — y[AI]r studio carousel</title>
  <link rel="stylesheet" href="../../../colors_and_type.css">
  <link rel="stylesheet" href="../../linkedin-carousel/shared/carousel.css">
</head>
<body>
  <div class="carousel-stage">
    <article class="slide is-case" dir="rtl" data-screen-label="HE · 09 Case">
      <!-- HE: client/scope/stack labels sit on the right; the outcome metric stays Latin-numeral and is locked LTR so −80% reads correctly. -->
      <div class="slide-frame">

        <header class="slide-header">
          <span class="slide-eyebrow">שטח <span class="dot">·</span> AI בפרודקשן</span>
          <span class="slide-stamp" dir="ltr"><span class="num">09</span> / 11</span>
        </header>

        <main class="slide-main">
          <span class="case-client"><span class="pip"></span> מקרה · <span dir="ltr">lognet systems</span></span>
          <h2 class="case-headline">שישה שבועות מפיילוט תקוע לסוכן בפרודקשן שעוזר לצוות למסור פיצ׳רים.</h2>
          <div class="case-grid">
            <div class="case-fact"><div class="k">היקף</div><div class="v">סוכן <span dir="ltr">AI ops</span> פנימי — משלב הקליטה ועד עלייה לאוויר</div></div>
            <div class="case-fact"><div class="k">סטאק</div><div class="v"><span dir="ltr">claude · verification harness · linear</span></div></div>
            <div class="case-outcome">
              <div class="num">−80<span style="font-size:0.55em">%</span></div>
              <div class="label">הפחתת עבודות תיקון במסמכי אפיון — מ-50% ל-10%.</div>
            </div>
          </div>
        </main>

        <footer class="slide-footer">
          <span class="wordmark-slot" dir="ltr">
            <img class="footer-logo" src="../../../assets/wordmark-compact.svg" alt="y[AI]r studio" style="height:24px;width:auto;display:block" />
          </span>
          <span class="page-num" dir="ltr"><span class="now">09</span><span class="sep">/</span>11</span>
        </footer>

      </div>
    </article>
  </div>

  <script>
    function fit() {
      const slide = document.querySelector('.slide');
      const stage = document.querySelector('.carousel-stage');
      if (!slide || !stage) return;
      const pad = 48;
      const sw = (stage.clientWidth  - pad) / 1080;
      const sh = (stage.clientHeight - pad) / 1350;
      slide.style.setProperty('--carousel-scale', Math.min(sw, sh, 1));
    }
    addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
