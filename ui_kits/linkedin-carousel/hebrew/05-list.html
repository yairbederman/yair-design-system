<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>HE · 05 list — y[AI]r studio carousel</title>
  <link rel="stylesheet" href="../../../colors_and_type.css">
  <link rel="stylesheet" href="../../linkedin-carousel/shared/carousel.css">
</head>
<body>
  <div class="carousel-stage">
    <article class="slide is-list" dir="rtl" data-screen-label="HE · 05 List · framework">
      <!-- HE: numbered rows render right-to-left; the 01..05 row numerals sit on the right edge, body label on the left. -->
      <div class="slide-frame">

        <header class="slide-header">
          <span class="slide-eyebrow">שטח <span class="dot">·</span> AI בפרודקשן</span>
          <span class="slide-stamp" dir="ltr"><span class="num">05</span> / 11</span>
        </header>

        <main class="slide-main">
          <h2 class="list-title">חמש סיבות שתהליכי <span class="ltr-inline" dir="ltr">[<span class="wordmark-ai" style="font-weight:700">AI</span>]</span> נתקעים אחרי הדמו.</h2>
          <ol class="list-rows">
            <li><span class="n">01</span><span class="t">אין בעלים על התהליך מקצה לקצה</span></li>
            <li><span class="n">02</span><span class="t">פרומפטים מתויגים כקוד, לא כאפיון</span></li>
            <li><span class="n">03</span><span class="t">אין שער אנושי לפני הלקוח</span></li>
            <li><span class="n">04</span><span class="t">כשלים שקטים, בלי תקציב שגיאות</span></li>
            <li><span class="n">05</span><span class="t">"נחזק את זה בספרינט הבא"</span></li>
          </ol>
        </main>

        <footer class="slide-footer">
          <span class="wordmark-slot" dir="ltr">
            <img class="footer-logo" src="../../../assets/wordmark-compact.svg" alt="y[AI]r studio" style="height:24px;width:auto;display:block" />
          </span>
          <span class="page-num" dir="ltr"><span class="now">05</span><span class="sep">/</span>11</span>
        </footer>

      </div>
    </article>
  </div>

  <script>
    function fit() {
      const slide = document.querySelector('.slide');
      const stage = document.querySelector('.carousel-stage');
      if (!slide || !stage) return;
      const pad = 48;
      const sw = (stage.clientWidth  - pad) / 1080;
      const sh = (stage.clientHeight - pad) / 1350;
      slide.style.setProperty('--carousel-scale', Math.min(sw, sh, 1));
    }
    addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
