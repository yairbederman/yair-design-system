<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>HE · 02 content — y[AI]r studio carousel</title>
  <link rel="stylesheet" href="../../../colors_and_type.css">
  <link rel="stylesheet" href="../../linkedin-carousel/shared/carousel.css">
</head>
<body>
  <div class="carousel-stage">
    <article class="slide is-content" dir="rtl" data-screen-label="HE · 02 Content">
      <!-- HE: the demo→production aside row is locked dir="ltr" so the arrow keeps left-to-right flow and the Latin tokens "demo" / "production" don't reorder. -->
      <div class="slide-frame">

        <header class="slide-header">
          <span class="slide-eyebrow">שטח <span class="dot">·</span> AI בפרודקשן</span>
          <span class="slide-stamp" dir="ltr"><span class="num">02</span> / 11</span>
        </header>

        <main class="slide-main">

          <span class="meta-label"><span style="display:inline-block;width:6px;height:6px;background:currentColor"></span> הפער</span>

          <h2 class="content-lede">
            הדמו עובד כי המסלול נשלט.
          </h2>

          <p class="slide-body">
            בפרודקשן יש <strong>חריגים</strong>, <strong>העברות בין אנשים</strong>,
            <strong>קלטים מבולגנים</strong> ו<strong>משתמשים אמיתיים</strong>.
          </p>

          <div class="content-aside" aria-hidden="true" dir="ltr">
            <span class="pip"></span> demo &nbsp;<span style="color:var(--rule-strong)">→</span>&nbsp; production
          </div>

        </main>

        <footer class="slide-footer">
          <span class="wordmark-slot" dir="ltr">
            <img class="footer-logo" src="../../../assets/wordmark-compact.svg" alt="y[AI]r studio" style="height:24px;width:auto;display:block" />
          </span>
          <span class="page-num" dir="ltr"><span class="now">02</span><span class="sep">/</span>11</span>
        </footer>

      </div>
    </article>
  </div>

  <script>
    function fit() {
      const slide = document.querySelector('.slide');
      const stage = document.querySelector('.carousel-stage');
      if (!slide || !stage) return;
      const pad = 48;
      const sw = (stage.clientWidth  - pad) / 1080;
      const sh = (stage.clientHeight - pad) / 1350;
      slide.style.setProperty('--carousel-scale', Math.min(sw, sh, 1));
    }
    addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
