<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>HE · 10 metric — y[AI]r studio carousel</title>
  <link rel="stylesheet" href="../../../colors_and_type.css">
  <link rel="stylesheet" href="../../linkedin-carousel/shared/carousel.css">
</head>
<body>
  <div class="carousel-stage">
    <article class="slide is-metric" dir="rtl" data-screen-label="HE · 10 Metric · proof">
      <!-- HE: hero numeral and the q3→q1 / n=180 context line stay LTR atoms; only the Hebrew caption flows RTL beneath. -->
      <div class="slide-frame">

        <header class="slide-header">
          <span class="slide-eyebrow">שטח <span class="dot">·</span> AI בפרודקשן</span>
          <span class="slide-stamp" dir="ltr"><span class="num">10</span> / 11</span>
        </header>

        <main class="slide-main">
          <span class="metric-eyebrow">הוכחה מהפרודקשן</span>
          <p class="metric-hero">−80<span class="unit">%</span></p>
          <p class="metric-caption">הפחתת עבודות תיקון במסמכי אפיון — מאחת מכל שתיים לאחת מכל עשר.</p>
          <p class="metric-context"><span class="ba">50% → 10%</span> · <span dir="ltr">q3 2025 → q1 2026</span> · <span dir="ltr">n=180</span></p>
        </main>

        <footer class="slide-footer">
          <span class="wordmark-slot" dir="ltr">
            <img class="footer-logo" src="../../../assets/wordmark-compact.svg" alt="y[AI]r studio" style="height:24px;width:auto;display:block" />
          </span>
          <span class="page-num" dir="ltr"><span class="now">10</span><span class="sep">/</span>11</span>
        </footer>

      </div>
    </article>
  </div>

  <script>
    function fit() {
      const slide = document.querySelector('.slide');
      const stage = document.querySelector('.carousel-stage');
      if (!slide || !stage) return;
      const pad = 48;
      const sw = (stage.clientWidth  - pad) / 1080;
      const sh = (stage.clientHeight - pad) / 1350;
      slide.style.setProperty('--carousel-scale', Math.min(sw, sh, 1));
    }
    addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
