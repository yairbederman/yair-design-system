<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color — Accent</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-0); padding: 24px; }
  .row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 12px; }
  .sw { height: 110px; border: 1px solid var(--rule); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }
  .name { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  .hex  { font-family: var(--font-mono); font-size: 11px; }
  .big  { font-family: var(--font-display); font-weight: 700; font-size: 32px; letter-spacing: -0.03em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#D96832"><span class="big" style="color:#121211">[AI]</span><div style="display:flex;justify-content:space-between"><span class="name" style="color:#121211">--accent</span><span class="hex" style="color:#121211">#D96832</span></div></div>
    <div class="sw" style="background:#E67E45"><span class="name" style="color:#121211">hover</span><span class="hex" style="color:#121211">#E67E45</span></div>
    <div class="sw" style="background:#BE5826"><span class="name" style="color:#F4F1EA">press</span><span class="hex" style="color:#F4F1EA">#BE5826</span></div>
    <div class="sw" style="background:rgba(217,104,50,0.12); border-color:rgba(217,104,50,0.30)"><span class="name" style="color:#E67E45">soft</span><span class="hex" style="color:#E67E45">12% alpha</span></div>
  </div>
</body>
</html>
