<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color — Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-0); padding: 16px 20px 20px; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .mark { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 500; letter-spacing: -0.02em; line-height: 1; }
  .mark .side { font-size: 22px; color: var(--fg-1); font-weight: 500; }
  .mark .dash { display: inline-block; width: 10px; height: 2px; background: var(--accent); }
  .mark .ai { background: var(--accent); color: var(--bg-0); padding: 2px 6px 3px; font-size: 18px; font-weight: 700; border-radius: 2px; }
  .grouplabel { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); }

  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { height: 96px; border: 1px solid var(--rule); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
  .name { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-2); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="head">
    <span class="mark"><span class="side">y</span><span class="dash"></span><span class="ai">AI</span><span class="dash"></span><span class="side">r</span></span>
    <span class="grouplabel">surfaces · dark</span>
  </div>
  <div class="row">
    <div class="sw" style="background:#0A0A0B"><span class="name" style="color:#A0A0A8">--bg-0</span><span class="hex">#0A0A0B</span></div>
    <div class="sw" style="background:#111114"><span class="name" style="color:#A0A0A8">--bg-1</span><span class="hex">#111114</span></div>
    <div class="sw" style="background:#17171C"><span class="name" style="color:#A0A0A8">--bg-2</span><span class="hex">#17171C</span></div>
    <div class="sw" style="background:#1F1F26"><span class="name" style="color:#A0A0A8">--bg-3</span><span class="hex">#1F1F26</span></div>
  </div>
</body>
</html>
