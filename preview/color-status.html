<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color — Status</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-0); padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .sw { height: 110px; border-radius: 4px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid; }
  .name { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  .hex  { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; }
  .ex { font-family: var(--font-mono); font-size: 14px; font-weight: 500; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:rgba(111,181,138,0.10); border-color:rgba(111,181,138,0.32); color:#6FB58A"><span class="ex">✓ shipped to prod</span><div style="display:flex;justify-content:space-between"><span class="name">--ok</span><span class="hex">#6FB58A</span></div></div>
    <div class="sw" style="background:rgba(224,169,59,0.10); border-color:rgba(224,169,59,0.36); color:#E0A93B"><span class="ex">⚠ pending review</span><div style="display:flex;justify-content:space-between"><span class="name">--warn</span><span class="hex">#E0A93B</span></div></div>
    <div class="sw" style="background:rgba(216,90,82,0.10); border-color:rgba(216,90,82,0.36); color:#D85A52"><span class="ex">✗ blocked / failed</span><div style="display:flex;justify-content:space-between"><span class="name">--err</span><span class="hex">#D85A52</span></div></div>
  </div>
</body>
</html>
