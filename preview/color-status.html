<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color — Status</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-0); padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .sw { height: 110px; border-radius: 4px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid; }
  .name { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  .hex  { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; }
  .ex { font-family: var(--font-mono); font-size: 14px; font-weight: 500; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:rgba(122,224,161,0.10); border-color:rgba(122,224,161,0.32); color:#7AE0A1"><span class="ex">✓ shipped to prod</span><div style="display:flex;justify-content:space-between"><span class="name">--ok</span><span class="hex">#7AE0A1</span></div></div>
    <div class="sw" style="background:rgba(245,197,24,0.10); border-color:rgba(245,197,24,0.36); color:#F5C518"><span class="ex">⚠ pending review</span><div style="display:flex;justify-content:space-between"><span class="name">--warn</span><span class="hex">#F5C518</span></div></div>
    <div class="sw" style="background:rgba(229,72,77,0.10); border-color:rgba(229,72,77,0.36); color:#E5484D"><span class="ex">✗ blocked / failed</span><div style="display:flex;justify-content:space-between"><span class="name">--err</span><span class="hex">#E5484D</span></div></div>
  </div>
</body>
</html>
