<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chips</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-0); padding: 28px 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .lab { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="lab">stack tags</div>
  <div class="row">
    <span class="chip">claude code</span>
    <span class="chip">next.js</span>
    <span class="chip">react</span>
    <span class="chip">java</span>
    <span class="chip">antigravity</span>
    <span class="chip">github copilot</span>
  </div>
  <div class="lab">status</div>
  <div class="row">
    <span class="chip chip-accent">ai-first</span>
    <span class="chip chip-ok">✓ shipped</span>
    <span class="chip">spec validated</span>
    <span class="chip">in progress</span>
  </div>
</body>
</html>
