<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-0); padding: 28px 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 16px; }
  .lab { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); width: 80px; }
</style>
</head>
<body>
  <div class="row"><span class="lab">primary</span><a class="btn btn-primary" href="#">book a call</a><a class="btn btn-primary" href="#">ship now</a></div>
  <div class="row"><span class="lab">secondary</span><a class="btn" href="#">read the approach</a><a class="btn" href="#">case studies</a></div>
  <div class="row"><span class="lab">ghost</span><a class="btn btn-ghost" href="#">view all</a><a class="btn btn-ghost" href="#">cancel</a></div>
</body>
</html>
