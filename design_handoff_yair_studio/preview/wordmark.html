<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wordmark — y[AI]r studio</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: var(--bg-0); }
  .lockup .wordmark-group { font-size: 88px; }
</style>
</head>
<body>
  <div class="lockup">
    <span class="wordmark-group wordmark-stack" aria-label="y[AI]r studio">
      <span class="wordmark">
        <span class="wordmark-y">y</span><span class="wordmark-bracket">[</span><span class="wordmark-ai">AI</span><span class="wordmark-bracket">]</span><span class="wordmark-r">r</span>
      </span>
      <span class="wordmark-studio">studio</span>
    </span>
  </div>
</body>
</html>
